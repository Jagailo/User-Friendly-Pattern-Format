name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Restore
        run: dotnet restore UFP.slnx

      - name: Build
        run: dotnet build UFP.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test UFP.slnx --configuration Release --no-build

      - name: Test (Python port)
        run: python3 -m unittest discover -s tests/UFP.Python.Tests -v

      - name: Test (JavaScript port)
        run: npm test

      - name: Test (PHP port)
        run: php tests/UFP.PHP.Tests/ufp.test.php
